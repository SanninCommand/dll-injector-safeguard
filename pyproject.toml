[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dll-injector-safeguard"
version = "0.6.3"
description = "Windows DLL injector with a mandatory safety-check pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dll-injector-safeguard contributors" }]
keywords = ["dll", "injector", "windows", "safety", "pipeline", "modding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "pywin32>=306; sys_platform == 'win32'",
  "pefile>=2023.2.7",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "black>=24.3",
  "mypy>=1.9",
]

[project.scripts]
dllinjector = "dllinjector.bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=dllinjector --cov-report=term-missing"